server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Staging on luftek.marvice.tech: keep it out of search results. Remove when moving to luftek.in.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Clean URLs: /about serves about.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    error_page 404 /404.html;
}
