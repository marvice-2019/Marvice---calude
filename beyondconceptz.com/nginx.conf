server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;  # behind the Coolify proxy: keep Location relative so it stays on https

    # One canonical host: www and .in redirect to https://beyondconceptz.com
    if ($host ~* "^(www\.beyondconceptz\.com|(www\.)?beyondconceptz\.in)$") {
        return 301 https://beyondconceptz.com$request_uri;
    }

    # Clean URLs: /about serves about.html; the old /about.html and /index.html 301 to the clean form
    if ($request_uri ~ "^/index\.html(\?.*)?$") {
        return 301 /$1;
    }
    if ($request_uri ~ "^/([a-z-]+)\.html(\?.*)?$") {
        return 301 /$1$2;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location ~* \.(css|js|jpg|jpeg|png|svg|webp)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Pages always revalidate; assets are fingerprinted (?v=hash) by build.py, so they can cache long
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /index.html;
}
