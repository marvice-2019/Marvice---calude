# Local production rehearsal: copy .env.example to .env, fill it, then `docker compose up --build`.
# Coolify does not use this file (see DEPLOY.md): it builds the Dockerfile and connects its own Postgres.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hydra
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydra -d hydra"]
      interval: 5s
      retries: 10
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgres://hydra:${POSTGRES_PASSWORD}@db:5432/hydra
    ports: ["3000:3000"]
    volumes: [uploads:/app/uploads]
volumes:
  db-data:
  uploads:
