# Coolify "Docker Compose" resource for https://video.marvice.tech
# In Coolify: give ONLY the `auth` service a domain (https://video.marvice.tech:8080)
# and set BASIC_AUTH_USER / BASIC_AUTH_PASSWORD in Environment Variables (see README).
# AI keys are optional; each one switches on its provider in the creator at /create.
services:
  studio:
    build:
      context: .
      args:
        HYPERFRAMES_VERSION: ${HYPERFRAMES_VERSION:-0.8.140}
    restart: unless-stopped
    environment:
      HYPERFRAMES_PROJECT: ${HYPERFRAMES_PROJECT:-studio}
    volumes:
      - hyperframes-projects:/projects
    shm_size: "1gb"

  # Prompt-to-video creator: same image as studio, renders into /projects/creations.
  creator:
    build:
      context: .
      args:
        HYPERFRAMES_VERSION: ${HYPERFRAMES_VERSION:-0.8.140}
    command: ["creator"]
    restart: unless-stopped
    environment:
      STUDIO_DIR: /projects/${HYPERFRAMES_PROJECT:-studio}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      SORA_MODEL: ${SORA_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      VEO_MODEL: ${VEO_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-}
      FAL_KEY: ${FAL_KEY:-}
    volumes:
      - hyperframes-projects:/projects
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/create/api/options"]
      interval: 30s
      timeout: 5s
      start_period: 30s

  # OpenMotion (reference-video remakes) at https://motion.marvice.tech, behind the same gate.
  motion:
    build:
      context: ./openmotion
    restart: unless-stopped
    environment:
      ATLASCLOUD_API_KEY: ${ATLASCLOUD_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
    volumes:
      - openmotion-data:/data
    shm_size: "1gb"

  # Studio and the creator have no login of their own (they can read, write and
  # delete files and start renders), so they are only reachable through this gate.
  auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
    restart: unless-stopped
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-admin}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?set BASIC_AUTH_PASSWORD}
    depends_on:
      - studio
      - creator
      - motion
    # Second public host for OpenMotion. Set here instead of in Coolify's Domains
    # field; Coolify keeps custom labels and its Traefik picks them up.
    labels:
      - "traefik.http.routers.marvice-openmotion-https.rule=Host(`motion.marvice.tech`)"
      - "traefik.http.routers.marvice-openmotion-https.entrypoints=https"
      - "traefik.http.routers.marvice-openmotion-https.tls=true"
      - "traefik.http.routers.marvice-openmotion-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.marvice-openmotion-https.service=marvice-openmotion"
      - "traefik.http.routers.marvice-openmotion-http.rule=Host(`motion.marvice.tech`)"
      - "traefik.http.routers.marvice-openmotion-http.entrypoints=http"
      - "traefik.http.routers.marvice-openmotion-http.middlewares=redirect-to-https"
      - "traefik.http.services.marvice-openmotion.loadbalancer.server.port=8080"

volumes:
  hyperframes-projects:
  openmotion-data:
