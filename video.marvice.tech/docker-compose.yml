# Coolify "Docker Compose" resource for https://video.marvice.tech
# In Coolify: set the domain of service `studio` to https://video.marvice.tech:3002
# and set BASIC_AUTH_USERS in the resource's Environment Variables (see README).
services:
  studio:
    build:
      context: .
      args:
        HYPERFRAMES_VERSION: ${HYPERFRAMES_VERSION:-0.8.140}
    restart: unless-stopped
    environment:
      - HYPERFRAMES_PROJECT=${HYPERFRAMES_PROJECT:-studio}
      - SERVICE_FQDN_STUDIO_3002
    volumes:
      - hyperframes-projects:/projects
    shm_size: "1gb"
    labels:
      # The Studio API can read/write/delete files and start renders without any
      # login, so it must never be public without this basic-auth layer.
      - traefik.http.middlewares.hf-auth.basicauth.users=${BASIC_AUTH_USERS:?set BASIC_AUTH_USERS}
      - traefik.http.routers.https-0-studio.middlewares=gzip,hf-auth

volumes:
  hyperframes-projects:
