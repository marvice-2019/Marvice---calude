<section class="explore" id="explore">
  <div class="wrap">
    <div class="head">
      <div><div class="label rv">Explore the S110</div><h2 class="cond rv">Look closer.<br>Tap any point.</h2></div>
      <p class="rv">Seven things that make the S110 rugged, practical and easy to own. Tap a point on the scooter, or let it walk you through.</p>
    </div>
    <div class="ex-grid">
      <div class="ex-stage" id="exStage">
        <img src="assets/img/GreenBike.webp" alt="Aventose S110, side view with interactive points" loading="lazy">
        <div class="scan"></div>
      </div>
      <div class="ex-panel" id="exPanel" aria-live="polite">
        <div class="ph"><img id="exImg" src="assets/img/SafeMode.webp" alt="" loading="lazy"></div>
        <div class="ex-meta"><span class="count"><b id="exN">01</b> / 07</span>
          <div class="ex-nav"><button id="exPrev" aria-label="Previous point">←</button><button id="exNext" aria-label="Next point">→</button></div></div>
        <div class="swap"><h3 class="cond" id="exTitle"></h3><p id="exText"></p></div>
        <div class="ex-bar"><i id="exBar"></i></div>
      </div>
    </div>
  </div>
</section>
