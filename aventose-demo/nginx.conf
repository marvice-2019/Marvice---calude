# Visitor IP comes from Cloudflare; fall back to the socket address.
map $http_cf_connecting_ip $client_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $client_key zone=lead:10m rate=6r/m;

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Enquiry form -> n8n workflow "Aventose — Website lead capture"
    location = /api/lead {
        limit_except POST { deny all; }
        limit_req zone=lead burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;

        proxy_pass https://n8n.marvice.tech/webhook/aventose-lead;
        proxy_ssl_server_name on;
        proxy_set_header Host n8n.marvice.tech;
        proxy_set_header CF-Connecting-IP $client_key;
        proxy_set_header X-Real-IP $client_key;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /assets/ {
        expires 30d;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
