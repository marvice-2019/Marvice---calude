# Hourhand: types, lint, unit tests (with a real Postgres for the database tests), a production build,
# and the end-to-end scripts against that build (local fake Google, Microsoft, Razorpay, Stripe and CalDAV servers) on every PR.
name: Hourhand CI

on:
  pull_request:
    paths: ["hourhand/**", ".github/workflows/hourhand-ci.yml"]
  push:
    branches: [main]
    paths: ["hourhand/**", ".github/workflows/hourhand-ci.yml"]

permissions:
  contents: read

concurrency:
  group: hourhand-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: hourhand
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hourhand/package-lock.json
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npm run lint
      - name: Unit tests
        # The database tests create and drop their own databases named after this one.
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hourhand_test
        run: npm test
      - name: Build
        run: npm run build
      - name: End-to-end
        # Drops and recreates hourhand_e2e for each group; any FAIL, or a script that crashes, fails the step.
        env:
          E2E_PG: postgres://postgres:postgres@localhost:5432
        run: sh e2e/run-all.sh
      - name: Keep e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: hourhand/e2e/.out/
          retention-days: 7
